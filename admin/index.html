<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Tunja Sin Huecos</title>

  <!-- LEAFLET CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>

    body{
      font-family: Arial;
      background:#111827;
      color:white;
      margin:0;
      padding:20px;
    }

    h1{
      text-align:center;
      margin-bottom:20px;
    }

    #map{
      width:100%;
      height:500px;
      border-radius:20px;
      margin-bottom:30px;
      overflow:hidden;
      border:2px solid #2563eb;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:#1f2937;
    }

    th, td{
      padding:12px;
      border:1px solid #374151;
      text-align:center;
    }

    th{
      background:#2563eb;
    }

    img{
      width:120px;
      border-radius:10px;
    }

    a{
      color:#60a5fa;
      text-decoration:none;
    }

    select{
      padding:8px;
      border-radius:8px;
      border:none;
    }

  </style>

</head>

<body>

  <h1>🚧 Tunja Sin Huecos - Panel Admin</h1>

  <!-- MAPA -->
  <div id="map"></div>

  <!-- TABLA -->
  <table>

    <thead>
      <tr>
        <th>ID</th>
        <th>Teléfono</th>
        <th>Dirección</th>
        <th>Foto</th>
        <th>Mapa</th>
        <th>Estado</th>
      </tr>
    </thead>

    <tbody id="tablaReportes">

    </tbody>

  </table>

  <!-- LEAFLET JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- APP -->
  <script src="app.js"></script>

  <!-- MAPA -->
  <script src="mapa.js"></script>

</body>

</html>
