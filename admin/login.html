<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login Admin</title>

  <style>

    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#0f172a;
      font-family:Arial;
    }

    .login-box{
      background:#1e293b;
      padding:40px;
      border-radius:20px;
      width:320px;
      box-shadow:0 0 20px rgba(0,0,0,0.5);
    }

    h1{
      color:white;
      text-align:center;
      margin-bottom:30px;
    }

    input{
      width:100%;
      padding:14px;
      margin-bottom:15px;
      border:none;
      border-radius:10px;
      background:#334155;
      color:white;
      font-size:16px;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:#2563eb;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      background:#1d4ed8;
    }

    .error{
      color:#ef4444;
      text-align:center;
      margin-top:15px;
    }

  </style>

</head>

<body>

  <div class="login-box">

    <h1>🔐 Panel Admin</h1>

    <input
      type="text"
      id="usuario"
      placeholder="Usuario"
    >

    <input
      type="password"
      id="password"
      placeholder="Contraseña"
    >

    <button onclick="login()">
      Ingresar
    </button>

    <div class="error" id="error"></div>

  </div>

  <script src="login.js"></script>

</body>
</html>
